# Answer-quality eval (issue #48). Måler noget andet end retrieval-eval:
# ikke "kom den rigtige side med i top-5", men "kan svaret faktisk hentes ud af
# de sektioner værktøjerne leverer, og bliver der sagt fra når svaret ikke findes".
#
# Felter pr. spørgsmål:
#   q             spørgsmålet, formuleret som Mads ville stille det
#   expect        sider der SKAL kunne bære svaret (én af dem er nok)
#   must_contain  en kort, ordret streng fra siden. Findes den ikke i det hentede,
#                 er svaret ikke funderet, uanset hvad en model måtte skrive
#   section       valgfri: den sektion svaret bør komme fra
#   unanswerable  true når wikien IKKE indeholder svaret; så er det rigtige svar
#                 at sige fra. Disse må aldrig få et must_contain
#
# Kør: python scripts/answer-eval.py
# Tilføj et spørgsmål hver gang et svar var forkert eller opfundet i praksis.

- q: hvad er min timepris for eksisterende kunder
