# Answer-quality eval. Måler noget andet end retrieval-eval: ikke "kom den rigtige
# side med i top-5", men "kan svaret faktisk hentes ud af de sektioner værktøjerne
# leverer, og bliver der sagt fra når svaret ikke findes".
#
# Felter pr. spørgsmål:
#   q             spørgsmålet, formuleret som du selv ville stille det
#   expect        sider der SKAL kunne bære svaret (én af dem er nok)
#   must_contain  en kort, ordret streng fra siden. Findes den ikke i det hentede,
#                 er svaret ikke funderet, uanset hvad en model måtte skrive
#   section       valgfri: den sektion svaret bør komme fra
#   unanswerable  true når vaulten IKKE indeholder svaret; så er det rigtige svar
#                 at sige fra. Disse må aldrig få et must_contain
#
# Kør: python scripts/answer-eval.py
# Tilføj et spørgsmål hver gang et svar var forkert eller opfundet i praksis.
#
# ADVARSEL — dette er et offentligt repo.
# Filen her er et tomt skelet med opdigtede eksempler. Dit eget sæt kommer til at
# indeholde priser, IP-adresser, kundenavne og personlige fakta, for det er præcis
# den slags spørgsmål der er værd at måle på. Hold det sæt i din egen private vault.
# Den offentlige skabelon har haft rigtige tal liggende her før; det er rettet, men
# lad være med at gentage fejlen når du forker.

# --- Et faktum der står ordret på en side -----------------------------------
- q: hvad er min timepris for eksisterende kunder
  expect: [priser-og-ydelser]
  must_contain: "<din timepris>"
  section: Timepris

# --- Et faktum dybt nede på en lang side ------------------------------------
# Den slags fanger om wiki_get's `omitted_sections` og sektionsvalget virker:
# står svaret ved tegn 20.000 af 60.000, skal kæden kunne finde derhen.
- q: hvad koster produktets billigste plan om måneden
  expect: [<dit-produkt>]
  must_contain: "<pris> kr/md"

# --- Infrastruktur ----------------------------------------------------------
- q: hvad er ip-adressen på hovedserveren
  expect: [<din-hostingudbyder>]
  must_contain: "<ip>"

- q: hvilken version kører vi af deployment-platformen
  expect: [<din-platform>]
  must_contain: "<version>"

# --- Relationer og aftaler --------------------------------------------------
- q: hvem er kontaktperson hos <kunde>
  expect: [<kunde>]
  must_contain: "<navn>"

- q: hvad venter jeg på fra <person> lige nu
  expect: [<person>]
  must_contain: "<hvad>"

# --- Abstention: vaulten ved det ikke, og skal sige fra ---------------------
# Uden disse måler evalen kun om der kommer et svar, ikke om svaret er sandt.
# En vidensbase der altid svarer er værre end en der siger fra.
- q: hvor mange ansatte har <en virksomhed du intet ved om>
  expect: []
  unanswerable: true

- q: hvad er <en persons> blodtype
  expect: []
  unanswerable: true

- q: hvad blev der besluttet på et møde der aldrig fandt sted
  expect: []
  unanswerable: true
