# gitleaks configuration for this template.
[extend]
useDefault = true

[[allowlists]]
description = "Raw source archives are not committed in the template, but keep the paths allowlisted for forks"
paths = [
  '''^_sources/''',
  '''^_intel/''',
  '''^_digest/''',
]

[[allowlists]]
description = "b1c0bc7 introduced selftest.py with its write-guard decoy written as a single literal. The decoy was never a real key; the next commit assembles the string at runtime so it no longer matches. The history scan still sees the old blob, so allowlist that one commit rather than rewrite public history."
commits = [
  "b1c0bc7b8a1aa74552851b4ade86d683e546844b",
]
