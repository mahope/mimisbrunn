name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

  private-data:
    name: No personal data in a public template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan for emails, public IPs and phone numbers
        run: python scripts/no-private-data.py

  trivy:
    name: Dependency and secret scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vulnerabilities and secrets (blocking)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Container misconfiguration (report only)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: deploy
          severity: CRITICAL,HIGH
          exit-code: "0"
