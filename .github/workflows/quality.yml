name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: MCP server selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --no-cache-dir "mcp>=1.12,<2" pyyaml uvicorn starlette
      - name: Compile all scripts
        run: python -m compileall -q scripts
      - name: Selftest
        env:
          WIKI_EMBED: "0"
        run: python scripts/selftest.py

      # Smoke test for the analysis scripts. They touch nothing and write nothing;
      # the point is that they cannot break unnoticed, the way a patch once broke
      # the MCP server. dns-check is deliberately left out — it queries DNS and
      # would make CI flaky for reasons that have nothing to do with the code.
      - name: Analysis scripts run
        env:
          WIKI_EMBED: "0"
        run: |
          python scripts/claims.py
          python scripts/open-actions.py --days 3650
          python scripts/wiki-lint.py
          python scripts/wiki-freshness.py
          python scripts/wiki_conflicts.py
          python scripts/completeness-score.py --dry-run

      # wiki-cli is the cloud routines' only way into the vault. If it breaks, every
      # routine fails — and they run on a different account, where a break is not
      # visible from here. Read path only; append and create write.
      - name: wiki-cli read path
        env:
          WIKI_EMBED: "0"
        run: |
          python scripts/wiki-cli.py --help
          python scripts/wiki-cli.py recent
          python scripts/wiki-cli.py stats
          python scripts/wiki-cli.py brief
          python scripts/wiki-cli.py commitments
          python scripts/wiki-cli.py append --help
          python scripts/wiki-cli.py create --help
